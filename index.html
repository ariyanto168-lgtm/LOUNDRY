<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir Laundry Digital - Cloud POS</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #09090b;
            color: #f4f4f5;
            user-select: none;
        }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="antialiased selection:bg-sky-600 selection:text-white">

    <div class="max-w-md mx-auto min-h-screen relative flex flex-col bg-zinc-950 border-x border-zinc-800 shadow-2xl pb-32">
        
        <!-- HEADER -->
        <header class="p-5 bg-zinc-900/80 backdrop-blur-md border-b border-zinc-800 sticky top-0 z-40 flex justify-between items-center">
            <div>
                <span class="text-[10px] uppercase tracking-widest text-sky-400 font-bold block">POS Laundry Digital</span>
                <h1 id="header-laundry-name" class="text-lg font-bold text-white">Laundry Express</h1>
            </div>
            <!-- STATUS KONEKSI -->
            <div id="connection-badge" class="text-[10px] px-2.5 py-1 rounded-full font-semibold bg-emerald-950 text-emerald-400 border border-emerald-500/30">
                🟢 Online
            </div>
        </header>

        <!-- SYNC STATUS -->
        <div id="sync-status" class="bg-sky-950/60 border-b border-sky-500/20 text-sky-300 text-[10px] px-4 py-1 text-center hidden">
            Menghubungkan ke Cloud...
        </div>

        <!-- MAIN CONTENT -->
        <main class="flex-1 p-4 space-y-4 overflow-y-auto">

            <!-- TAB 1: KASIR / INPUT ORDER -->
            <section id="sec-kasir" class="tab-section space-y-4">
                <form onsubmit="addOrder(event)" class="bg-zinc-900 p-4 rounded-2xl border border-zinc-800 space-y-3">
                    <span class="text-xs font-bold text-sky-400 block">➕ Input Pesanan Baru</span>
                    
                    <div class="space-y-2 text-xs">
                        <div>
                            <label class="block text-zinc-400 mb-1">Nama Pelanggan:</label>
                            <input type="text" id="order-customer" placeholder="Cth: Bpk. Budi" required class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-sky-500">
                        </div>
                        <div>
                            <label class="block text-zinc-400 mb-1">Jenis Layanan & Harga per Satuan:</label>
                            <select id="order-service" onchange="calculateTotal()" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-sky-500">
                                <option value="Cuci Kiloan (Rp 6.000/kg)" data-price="6000">Cuci Kiloan (Rp 6.000 / kg)</option>
                                <option value="Cuci + Setrika (Rp 8.000/kg)" data-price="8000">Cuci + Setrika (Rp 8.000 / kg)</option>
                                <option value="Setrika Saja (Rp 5.000/kg)" data-price="5000">Setrika Saja (Rp 5.000 / kg)</option>
                                <option value="Cuci Karpet (Rp 35.000/pcs)" data-price="35000">Cuci Karpet (Rp 35.000 / pcs)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-zinc-400 mb-1">Berat / Jumlah (Kg atau Pcs):</label>
                            <input type="number" step="0.5" id="order-qty" value="1" min="0.5" oninput="calculateTotal()" required class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-sky-500">
                        </div>
                        <div>
                            <label class="block text-zinc-400 mb-1">Status Pembayaran:</label>
                            <select id="order-pay" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-sky-500">
                                <option value="Lunas">Lunas</option>
                                <option value="Belum Lunas">Belum Lunas (Bayar Nanti)</option>
                            </select>
                        </div>
                        <div class="bg-zinc-950 p-3 rounded-xl border border-zinc-800 flex justify-between items-baseline">
                            <span class="text-zinc-400">Total Harga:</span>
                            <span id="order-total-preview" class="text-base font-bold text-sky-400">Rp 6.000</span>
                        </div>
                    </div>
                    <button type="submit" class="w-full py-2.5 bg-sky-700 hover:bg-sky-600 text-white font-semibold text-xs rounded-xl transition shadow">Simpan & Buat Pesanan</button>
                </form>
            </section>

            <!-- TAB 2: DAFTAR PESANAN & STATUS -->
            <section id="sec-pesanan" class="tab-section hidden space-y-4">
                <div class="flex justify-between items-center px-1">
                    <span class="text-xs font-bold text-zinc-300">Daftar Cucian Masuk</span>
                    <span id="order-count-badge" class="text-[10px] bg-zinc-800 text-zinc-300 px-2 py-0.5 rounded-full">0 Order</span>
                </div>
                <div id="orders-list-container" class="space-y-2">
                    <!-- Rendered via JS -->
                </div>
            </section>

            <!-- TAB 3: LAPORAN KEUANGAN -->
            <section id="sec-laporan" class="tab-section hidden space-y-4">
                <div class="bg-gradient-to-br from-sky-900/60 via-zinc-900 to-zinc-900 border border-sky-500/30 p-5 rounded-3xl shadow-xl space-y-3">
                    <span class="text-xs text-sky-300 font-medium block">Total Pendapatan Laundry</span>
                    <h2 id="lap-total-pendapatan" class="text-3xl font-extrabold text-white tracking-tight">Rp 0</h2>
                    <div class="grid grid-cols-2 gap-2 pt-2 border-t border-zinc-800 text-xs">
                        <div>
                            <span class="text-zinc-400 block text-[10px]">Total Order</span>
                            <span id="lap-total-order" class="font-bold text-white text-sm">0 Pesanan</span>
                        </div>
                        <div>
                            <span class="text-zinc-400 block text-[10px]">Lunas / Belum</span>
                            <span id="lap-status-bayar" class="font-bold text-sky-400 text-sm">-</span>
                        </div>
                    </div>
                </div>
            </section>

            <!-- FOOTER INFO & BRANDING -->
            <footer class="text-center pt-6 pb-2 space-y-1">
                <p class="text-[10px] text-zinc-500">Kasir Laundry Digital <span id="app-version" class="font-mono text-zinc-400">v1.2.0</span></p>
                <p class="text-[11px] font-semibold tracking-wider text-sky-500/80">Powered by Ari GPM</p>
            </footer>

        </main>

        <!-- NAVBAR BAWAH -->
        <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-zinc-900/90 backdrop-blur-md border-t border-zinc-800 px-6 py-3 flex justify-between items-center z-40 shadow-2xl">
            <button onclick="switchTab('kasir')" class="nav-btn flex flex-col items-center text-sky-400 transition" data-target="kasir">
                <span class="text-base">🛒</span>
                <span class="text-[9px] mt-0.5 font-medium">Kasir</span>
            </button>
            <button onclick="switchTab('pesanan')" class="nav-btn flex flex-col items-center text-zinc-400 hover:text-zinc-200 transition" data-target="pesanan">
                <span class="text-base">📋</span>
                <span class="text-[9px] mt-0.5 font-medium">Pesanan</span>
            </button>
            <button onclick="switchTab('laporan')" class="nav-btn flex flex-col items-center text-zinc-400 hover:text-zinc-200 transition" data-target="laporan">
                <span class="text-base">📊</span>
                <span class="text-[9px] mt-0.5 font-medium">Laporan</span>
            </button>
            <button onclick="toggleSettingsModal()" class="flex flex-col items-center text-zinc-400 hover:text-zinc-200 transition">
                <span class="text-base">⚙️</span>
                <span class="text-[9px] mt-0.5 font-medium">Atur</span>
            </button>
        </nav>

        <!-- MODAL SETTINGS -->
        <div id="settings-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-6">
            <div class="bg-zinc-900 border border-zinc-800 rounded-3xl p-6 max-w-sm w-full space-y-4 shadow-2xl text-white">
                <div class="flex justify-between items-center border-b border-zinc-800 pb-3">
                    <h2 class="text-sm font-bold text-sky-400">⚙️ Pengaturan Kasir</h2>
                    <button onclick="toggleSettingsModal()" class="text-zinc-400 hover:text-white font-bold">✕</button>
                </div>
                <div class="space-y-3 text-xs">
                    <div>
                        <label class="block text-zinc-400 mb-1">URL Web App Google Script:</label>
                        <input type="text" id="setting-script-url" placeholder="Tempel URL Web App..." class="w-full bg-zinc-950 border border-zinc-700 rounded-xl px-3 py-2 text-white text-[11px]">
                    </div>
                    <div>
                        <label class="block text-zinc-400 mb-1">Nama Usaha Laundry:</label>
                        <input type="text" id="setting-laundry-name" class="w-full bg-zinc-950 border border-zinc-700 rounded-xl px-3 py-2 text-white">
                    </div>
                </div>
                <div class="flex gap-2 pt-2 border-t border-zinc-800">
                    <button onclick="saveSettings()" class="w-full py-2.5 bg-sky-700 hover:bg-sky-600 font-semibold rounded-xl transition">Simpan</button>
                </div>
            </div>
        </div>

    </div>

    <!-- JAVASCRIPT -->
    <script>
        let currentTab = 'kasir';
        let appData = { transaksi: [] };

        window.addEventListener('DOMContentLoaded', () => {
            const savedName = localStorage.getItem('laundry_name') || 'Laundry Express';
            document.getElementById('header-laundry-name').innerText = savedName;
            
            checkConnectionStatus();
            window.addEventListener('online', handleOnline);
            window.addEventListener('offline', handleOffline);

            calculateTotal();
            loadLocalCacheOrFetch();
            switchTab('kasir');
        });

        function checkConnectionStatus() {
            const badge = document.getElementById('connection-badge');
            if (navigator.onLine) {
                badge.className = "text-[10px] px-2.5 py-1 rounded-full font-semibold bg-emerald-950 text-emerald-400 border border-emerald-500/30";
                badge.innerText = "🟢 Online";
            } else {
                badge.className = "text-[10px] px-2.5 py-1 rounded-full font-semibold bg-rose-950 text-rose-400 border border-rose-500/30";
                badge.innerText = "🔴 Offline";
            }
        }

        function handleOnline() {
            checkConnectionStatus();
            syncOfflineQueue();
        }

        function handleOffline() {
            checkConnectionStatus();
        }

        function showSync(text) {
            const el = document.getElementById('sync-status');
            el.innerText = text;
            el.classList.remove('hidden');
        }
        function hideSync() {
            document.getElementById('sync-status').classList.add('hidden');
        }
        function getScriptUrl() {
            return localStorage.getItem('laundry_script_url') || '';
        }

        async function loadLocalCacheOrFetch() {
            const cached = localStorage.getItem('laundry_cache_data');
            if (cached) {
                try {
                    appData = JSON.parse(cached);
                    refreshUI();
                } catch(e) {}
            }
            if (navigator.onLine) {
                await fetchAllData();
            }
        }

        async function fetchAllData() {
            const url = getScriptUrl();
            if (!url || !navigator.onLine) return;

            showSync("Menarik data cloud...");
            try {
                const response = await fetch(`${url}?action=getData`);
                const result = await response.json();
                appData = result;
                localStorage.setItem('laundry_cache_data', JSON.stringify(result));
                refreshUI();
            } catch (err) {
                console.error(err);
            } finally {
                hideSync();
            }
        }

        async function sendPostData(payload, successMsg) {
            const url = getScriptUrl();
            if (!url) {
                alert("URL Web App belum diatur di Pengaturan (⚙️)!");
                toggleSettingsModal();
                return;
            }

            // Jika offline, simpan ke antrean lokal HP
            if (!navigator.onLine) {
                saveToOfflineQueue(payload);
                
                // Update data lokal secara instan agar langsung nampak di list pesanan
                applyLocalOptimisticUpdate(payload);
                
                alert("📴 Tidak ada sinyal! Pesanan disimpan sementara di HP. Akan otomatis disinkronkan saat online.");
                switchTab('pesanan');
                return;
            }

            showSync("Menyimpan ke Cloud...");
            try {
                await fetch(url, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify(payload)
                });
                if(successMsg) alert(successMsg);
                await fetchAllData();
            } catch (err) {
                console.error("Gagal terhubung, menyimpan ke offline queue:", err);
                saveToOfflineQueue(payload);
                applyLocalOptimisticUpdate(payload);
                alert("⚠️ Koneksi terganggu. Data disimpan secara offline di HP.");
                switchTab('pesanan');
            } finally {
                hideSync();
            }
        }

        function saveToOfflineQueue(payload) {
            let queue = JSON.parse(localStorage.getItem('laundry_offline_queue') || '[]');
            queue.push(payload);
            localStorage.setItem('laundry_offline_queue', JSON.stringify(queue));
        }

        async function syncOfflineQueue() {
            let queue = JSON.parse(localStorage.getItem('laundry_offline_queue') || '[]');
            if (queue.length === 0) return;

            const url = getScriptUrl();
            if (!url) return;

            showSync(`Menyinkronkan ${queue.length} data offline...`);
            try {
                for (let payload of queue) {
                    await fetch(url, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'text/plain' },
                        body: JSON.stringify(payload)
                    });
                }
                localStorage.removeItem('laundry_offline_queue');
                await fetchAllData();
                console.log("Sinkronisasi offline berhasil!");
            } catch (err) {
                console.error("Gagal sinkronisasi offline:", err);
            } finally {
                hideSync();
            }
        }

        function applyLocalOptimisticUpdate(payload) {
            if (!appData.transaksi) appData.transaksi = [];
            
            if (payload.action === 'addOrder') {
                appData.transaksi.push([
                    payload.id,
                    payload.customerName,
                    payload.service,
                    payload.qty,
                    payload.total,
                    payload.payStatus,
                    payload.laundryStatus,
                    payload.date
                ]);
            } else if (payload.action === 'updateStatus') {
                for (let row of appData.transaksi) {
                    if (row[0] == payload.id) {
                        row[6] = payload.newStatus;
                        break;
                    }
                }
            } else if (payload.action === 'deleteOrder') {
                appData.transaksi = appData.transaksi.filter(row => row[0] != payload.id);
            }
            
            localStorage.setItem('laundry_cache_data', JSON.stringify(appData));
            refreshUI();
        }

        function switchTab(tabId) {
            currentTab = tabId;
            document.querySelectorAll('.tab-section').forEach(sec => sec.classList.add('hidden'));
            document.getElementById('sec-' + tabId).classList.remove('hidden');

            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('text-sky-400');
                btn.classList.add('text-zinc-400');
                if(btn.getAttribute('data-target') === tabId) {
                    btn.classList.remove('text-zinc-400');
                    btn.classList.add('text-sky-400');
                }
            });
            refreshUI();
        }

        function formatRupiah(num) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(num);
        }

        function calculateTotal() {
            const select = document.getElementById('order-service');
            const price = parseFloat(select.options[select.selectedIndex].getAttribute('data-price')) || 0;
            const qty = parseFloat(document.getElementById('order-qty').value) || 1;
            const total = price * qty;
            document.getElementById('order-total-preview').innerText = formatRupiah(total);
        }

        async function addOrder(event) {
            event.preventDefault();
            const customerName = document.getElementById('order-customer').value.trim();
            const serviceSelect = document.getElementById('order-service');
            const service = serviceSelect.value;
            const price = parseFloat(serviceSelect.options[serviceSelect.selectedIndex].getAttribute('data-price'));
            const qty = parseFloat(document.getElementById('order-qty').value);
            const total = price * qty;
            const payStatus = document.getElementById('order-pay').value;
            const laundryStatus = 'Proses Cuci';
            const date = new Date().toLocaleDateString('id-ID') + ' ' + new Date().toLocaleTimeString('id-ID', {hour: '2-digit', minute:'2-digit'});
            const id = 'L_' + Date.now();

            document.getElementById('order-customer').value = '';
            document.getElementById('order-qty').value = '1';

            await sendPostData({ action: 'addOrder', id, customerName, service, qty, total, payStatus, laundryStatus, date }, 'Pesanan berhasil dicatat!');
            switchTab('pesanan');
        }

        async function updateStatus(id, newStatus) {
            await sendPostData({ action: 'updateStatus', id, newStatus });
        }

        async function deleteOrder(id) {
            if(confirm('Hapus riwayat pesanan ini?')) {
                await sendPostData({ action: 'deleteOrder', id }, 'Pesanan dihapus!');
            }
        }

        function refreshUI() {
            renderOrdersList();
            updateReportStats();
        }

        function renderOrdersList() {
            const container = document.getElementById('orders-list-container');
            const badge = document.getElementById('order-count-badge');
            const orders = appData.transaksi || [];

            badge.innerText = `${orders.length} Order`;
            container.innerHTML = '';

            if(orders.length === 0) {
                container.innerHTML = `<p class="text-xs text-zinc-500 text-center py-4">Belum ada pesanan laundry.</p>`;
                return;
            }

            orders.slice().reverse().forEach(row => {
                const id = row[0];
                const cust = row[1];
                const serv = row[2];
                const qty = row[3];
                const total = row[4];
                const pay = row[5];
                const status = row[6];
                const date = row[7];

                let statusColor = 'bg-amber-950 text-amber-300 border-amber-500/35';
                if(status === 'Selesai') statusColor = 'bg-sky-950 text-sky-300 border-sky-500/35';
                if(status === 'Sudah Diambil') statusColor = 'bg-emerald-950 text-emerald-300 border-emerald-500/35';

                container.innerHTML += `
                    <div class="bg-zinc-900 border border-zinc-800 p-3.5 rounded-2xl space-y-2 text-xs">
                        <div class="flex justify-between items-start">
                            <div>
                                <span class="font-bold text-white text-sm block">${cust}</span>
                                <span class="text-[10px] text-zinc-400">${date}</span>
                            </div>
                            <span class="text-[10px] px-2.5 py-0.5 rounded-full border ${statusColor} font-semibold">${status}</span>
                        </div>
                        <div class="border-t border-zinc-800 pt-2 flex justify-between items-center text-[11px]">
                            <div>
                                <span class="text-zinc-300 block">${serv} (${qty})</span>
                                <span class="font-mono font-bold text-sky-400">${formatRupiah(total)} • <span class="${pay === 'Lunas' ? 'text-emerald-400' : 'text-rose-400'}">${pay}</span></span>
                            </div>
                        </div>
                        <div class="flex gap-1.5 pt-1">
                            <select onchange="updateStatus('${id}', this.value)" class="bg-zinc-950 border border-zinc-700 text-[10px] text-white rounded-lg px-2 py-1">
                                <option value="" disabled selected>Ubah Status...</option>
                                <option value="Proses Cuci">Proses Cuci</option>
                                <option value="Selesai">Selesai (Siap Ambil)</option>
                                <option value="Sudah Diambil">Sudah Diambil</option>
                            </select>
                            <button onclick="deleteOrder('${id}')" class="px-2 py-1 bg-zinc-800 hover:bg-red-900 text-zinc-400 hover:text-white rounded-lg text-[10px] transition">Hapus</button>
                        </div>
                    </div>
                `;
            });
        }

        function updateReportStats() {
            const orders = appData.transaksi || [];
            let totalRev = 0;
            orders.forEach(row => {
                totalRev += parseFloat(row[4]) || 0;
            });

            document.getElementById('lap-total-pendapatan').innerText = formatRupiah(totalRev);
            document.getElementById('lap-total-order').innerText = orders.length + " Pesanan";
            document.getElementById('lap-status-bayar').innerText = "Terhitung Cloud";
        }

        function toggleSettingsModal() {
            const modal = document.getElementById('settings-modal');
            modal.classList.toggle('hidden');
            if(!modal.classList.contains('hidden')) {
                document.getElementById('setting-script-url').value = localStorage.getItem('laundry_script_url') || '';
                document.getElementById('setting-laundry-name').value = localStorage.getItem('laundry_name') || 'Laundry Express';
            }
        }

        function saveSettings() {
            localStorage.setItem('laundry_script_url', document.getElementById('setting-script-url').value.trim());
            localStorage.setItem('laundry_name', document.getElementById('setting-laundry-name').value.trim());
            document.getElementById('header-laundry-name').innerText = localStorage.getItem('laundry_name');
            toggleSettingsModal();
            fetchAllData();
            alert('Pengaturan kasir disimpan!');
        }
    </script>
</body>
</html>
